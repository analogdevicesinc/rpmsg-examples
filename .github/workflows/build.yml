name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: analogdevicesinc/doctools/cloudsmith-auth@action
        with:
          namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
          service-slug: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Install CCES
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          curl -1sLf \
            -H "Authorization: Bearer $CLOUDSMITH_API_KEY" \
            -o adi-cces-linux-amd64-3.0.3.deb \
            "https://dl.cloudsmith.io/basic/${{ vars.CLOUDSMITH_NAMESPACE }}/restricted/deb/ubuntu/pool/any-version/main/a/ad/adi-cces-3.0.3_3.0.3/adi-cces-linux-amd64-3.0.3.deb"

          echo "adi-cces-3.0.3 adi-cces-3.0.3/accept-sla boolean true" \
            | sudo debconf-set-selections
          # --force-depends bypasses the Pre-Depends on libncursesw5 which was
          # dropped in Ubuntu 24.04; the runtime lib is satisfied by the .so.5
          # symlink created in the previous step
          sudo dpkg --force-depends -i adi-cces-linux-amd64-3.0.3.deb

      - name: Install sharcLinux toolchain
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          curl -1sLf \
            -H "Authorization: Bearer $CLOUDSMITH_API_KEY" \
            -o sharc-linux-support-files-cces-3.0.3-20250704.tar.xz \
            "https://dl.cloudsmith.io/basic/${{ vars.CLOUDSMITH_NAMESPACE }}/restricted/raw/versions/3.0.3/sharc-linux-support-files-cces-3.0.3-20250704.tar.xz"

          sudo tar -xJ --no-same-owner \
            -f sharc-linux-support-files-cces-3.0.3-20250704.tar.xz \
            -C /opt/analog/cces/3.0.3/

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            make \
            libwebkit2gtk-4.1-0 \
            libncurses6 \
            libncursesw6 \
            libc6:i386 \
            libstdc++6:i386 \
            libxtst6 \
            libgtk-3-0t64 \
            libsm6 \
            libglib2.0-0t64 \
            libx11-6 \
            libxrender1 \
            libxext6 \
            libxft2 \
            fontconfig \
            debconf-utils \
            xz-utils
          # CCES was built against older sonames; create compatibility symlinks
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0 \
                      /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.0.so.37
          sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 \
                      /lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /lib/x86_64-linux-gnu/libncursesw.so.6 \
                      /lib/x86_64-linux-gnu/libncursesw.so.5
          sudo ldconfig

      - name: Install license
        run: |
          mkdir -p ~/.analog/cces
          echo "${{ secrets.CCES_LICENSE_DAT }}" > ~/.analog/cces/license.dat

      - name: Set hostname for FLEXlm license check
        run: sudo hostname build.analog.com

      - name: Build Core1
        env:
          PATH: /opt/analog/cces/3.0.3:/opt/analog/cces/3.0.3/Eclipse:${{ env.PATH }}
        run: |
          cd rpmsg_echo_example_Core1
          cces -nosplash \
            -application com.analog.crosscore.headlesstools \
            -data /tmp/cces-workspace \
            -project . \
            -cleanBuild all

      - name: Build Core2
        env:
          PATH: /opt/analog/cces/3.0.3:/opt/analog/cces/3.0.3/Eclipse:${{ env.PATH }}
        run: |
          cd rpmsg_echo_example_Core2
          cces -nosplash \
            -application com.analog.crosscore.headlesstools \
            -data /tmp/cces-workspace \
            -project . \
            -cleanBuild all

      - name: Copy .dxe to .elf
        run: |
          cp rpmsg_echo_example_Core1/Debug/rpmsg_echo_example_Core1.dxe \
             rpmsg_echo_example_Core1/Debug/rpmsg_echo_example_Core1.elf
          cp rpmsg_echo_example_Core2/Debug/rpmsg_echo_example_Core2.dxe \
             rpmsg_echo_example_Core2/Debug/rpmsg_echo_example_Core2.elf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sharc-firmware
          path: |
            rpmsg_echo_example_Core1/Debug/*.ldr
            rpmsg_echo_example_Core1/Debug/*.dxe
            rpmsg_echo_example_Core1/Debug/*.elf
            rpmsg_echo_example_Core2/Debug/*.ldr
            rpmsg_echo_example_Core2/Debug/*.dxe
            rpmsg_echo_example_Core2/Debug/*.elf
